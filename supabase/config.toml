#:schema https://supabase.com/schemas/config/v1.json
# Supabase CLI configuration for the shared analytics project.
#
# The Supabase project is shared with other sites, so everything SuperPDF owns
# is namespaced: the `superpdf_*` tables and the `superpdf-track` /
# `superpdf-analytics` edge functions. Nothing here touches another project's
# tables.

project_id = "superpdf"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
enable_signup = false
enable_anonymous_sign_ins = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2
